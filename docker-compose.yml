version: "3.9"

services:
  db:
    image: postgres:16
    container_name: mixq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway
    ports:
      - "41137:5432"
    volumes:
      - mixq_pgdata:/var/lib/postgresql/data

volumes:
  mixq_pgdata:
