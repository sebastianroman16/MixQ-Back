name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mixq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mixq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mixq_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mixq_test
      PG_SSL_MODE: disable
      TEST_PG_SSL_MODE: disable
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
      JWT_EXPIRES_IN: 10m
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --runInBand
      - run: pnpm build
      - run: pnpm prisma:migrate:deploy
      - run: pnpm test:e2e --runInBand

  smoke-staging:
    if: ${{ vars.STAGING_BASE_URL != '' }}
    needs: test
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      SMOKE_REQUIRE_INTEGRATIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke-test.mjs
